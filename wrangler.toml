# The name must match your Worker's name in the Cloudflare dashboard (Workers & Pages).
name = "name"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "."
binding = "ASSETS"
# Only /api/* runs the Worker; everything else is served directly as a static file.
run_worker_first = ["/api/*"]
